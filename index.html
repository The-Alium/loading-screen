<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
        }

        #bgimage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
            z-index: 1;
        }
    </style>
</head>
<body>

    <img id="bgimage" src="img/background.jpg" alt="">

    <audio id="bgaudio" loop>
        <source src="audio/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bgaudio');

        function startMedia() {
            audio.volume = 1.0;

            audio.play().then(() => {
                console.log("Audio started");
            }).catch(err => console.log("Audio error: ", err));
        }

        startMedia();

        document.addEventListener('DOMContentLoaded', startMedia);

        window.onload = startMedia;

        const forcePlay = setInterval(() => {
            if (audio.paused) {
                startMedia();
            } else {
                clearInterval(forcePlay);
            }
        }, 500);
    </script>
</body>
</html>
